    <meta charset="UTF-8">

        body {
            font-family: Arial, sans-serif;

            background-color: #f0f0f0;

        }
        
        canvas {
            border: 1px solid black;
            display: block;

        }
        
        .navigation {
            margin-top: 20px;
        }
        
        a {
            color: blue;
            text-decoration: none;
            padding: 5px;
        }
        
        a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    
<h1>Simple Jumping Game</h1>
<p>Use the spacebar or tap to jump!</p>

<div class="game-container">
    <canvas id="gameCanvas" width="400" height="300"></canvas>
</div>

<script>
document.addEventListener("DOMContentLoaded", function() {
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    let playerX = 50;
    let playerY = 200;
    let gravity = 1;
    let velocity = 0;
    let isJumping = false;

    // Mobile touch event handler
    canvas.addEventListener('touchstart', () => handleJump());

    // Keyboard event listener for space bar
    window.addEventListener('keydown', (event) => {
        if(event.key === ' ') {
            handleJump();
        }
    });

    function drawPlayer() {
        ctx.fillStyle = '#ff0000';
        ctx.beginPath();
        ctx.arc(playerX, playerY, 10, 0, Math.PI * 2);
        ctx.fill();
    }

    function updatePosition() {
        if(isJumping){
            velocity += gravity;
            playerY += velocity;
            
            if(playerY > 200){
                playerY = 200;
                isJumping = false;
                velocity = 0;
            }
        }
    }

    function handleJump(){
        if(!isJumping){
            isJumping = true;
            velocity = -20;
        }
    }

    function animate() {
        requestAnimationFrame(animate);
        ctx.clearRect(0, 0, canvas.width, canvas.height);   
        drawPlayer();     
        updatePosition();
    }

    animate();
});
</script>
