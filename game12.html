<h1>Jump Runner</h1>

<canvas id="game" width="360" height="200"></canvas>

<div id="info">Очки: <span id="score">0</span></div>
<button onclick="restart()">Перезапуск</button>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

let player, obstacle, score, gravity, gameOver;

function init(){
    player = {
        x: 40,
        y: 140,
        w: 20,
        h: 20,
        vy: 0,
        onGround: true
    };

    obstacle = {
        x: canvas.width,
        y: 150,
        w: 20,
        h: 30,
        speed: 3
    };

    gravity = 0.7;
    score = 0;
    gameOver = false;

    loop();
}

function draw(){
    ctx.clearRect(0,0,canvas.width,canvas.height);

    // ground
    ctx.fillStyle="#444";
    ctx.fillRect(0,170,canvas.width,30);

    // player
    ctx.fillStyle="#0af";
    ctx.fillRect(player.x, player.y, player.w, player.h);

    // obstacle
    ctx.fillStyle="#f33";
    ctx.fillRect(obstacle.x, obstacle.y, obstacle.w, obstacle.h);
}

function update(){
    // gravity
    player.vy += gravity;
    player.y += player.vy;

    if(player.y + player.h >= 170){
        player.y = 170 - player.h;
        player.vy = 0;
        player.onGround = true;
    }

    obstacle.x -= obstacle.speed;

    if(obstacle.x + obstacle.w < 0){
        obstacle.x = canvas.width + Math.random()*100;
        score++;
        document.getElementById("score").textContent = score;
    }

    // collision
    if(
        player.x < obstacle.x + obstacle.w &&
        player.x + player.w > obstacle.x &&
        player.y < obstacle.y + obstacle.h &&
        player.y + player.h > obstacle.y
    ){
        gameOver = true;
    }
}

function loop(){
    if(gameOver){
        ctx.fillStyle="#fff";
        ctx.font="20px Arial";
        ctx.fillText("Игра окончена!",110,100);
        return;
    }

    update();
    draw();
    requestAnimationFrame(loop);
}

function jump(){
    if(player.onGround){
        player.vy = -10;
        player.onGround = false;
    }
}

// keyboard
document.addEventListener("keydown", e=>{
    if(e.code === "Space") jump();
    if(e.code === "ArrowLeft") player.x -= 10;
    if(e.code === "ArrowRight") player.x += 10;
});

// mobile tap
canvas.addEventListener("touchstart", e=>{
    e.preventDefault();
    jump();
});

// mouse click also jumps
canvas.addEventListener("mousedown", jump);

function restart(){
    document.getElementById("score").textContent = "0";
    init();
}

init();
</script>
