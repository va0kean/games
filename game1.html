<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <link rel="icon" href="favicon.svg">
  <title>Игра 1: Runner-copilot</title>
  <style>
    body { margin:0; font-family:sans-serif; background:#0f172a; color:#fff; }
    header {
      background:#1e293b;
      padding:10px;
      display:flex;
      justify-content:space-between;
      align-items:center;
    }
    nav a {
      color:#22d3ee;
      text-decoration:none;
      margin:0 8px;
      font-weight:bold;
    }
    nav a:hover { color:#f43f5e; }
    .wrap { max-width:900px; margin:20px auto; }
    .game { position:relative; width:100%; height:300px; background:#222; overflow:hidden; }
    .player { position:absolute; left:60px; bottom:60px; width:28px; height:40px; background:#22d3ee; }
    .obstacle { position:absolute; bottom:60px; width:24px; height:36px; background:#f43f5e; }
    .hud { margin-top:10px; }
  </style>
</head>
<body>
  <header>
    <div><strong>Runner_copilot</strong></div>
    <nav>
      <a href="index.html">🏠 Главная</a>
      <a href="game2.html">Игра 2</a>
      <a href="game3.html">Игра 3</a>
      <a href="game4.html">Игра 4</a>
    </nav>
  </header>

  <div class="wrap">
    <div class="game" id="game">
      <div class="player" id="player"></div>
    </div>
    <div class="hud">
      Счёт: <span id="score">0</span>
    </div>
  </div>

  <script>
    const gameEl = document.getElementById('game');
    const playerEl = document.getElementById('player');
    const scoreEl = document.getElementById('score');

    let y = 0, vy = 0, jumping = false;
    const gravity = 0.6, jumpVelocity = -11;
    let obstacles = [], score = 0;

    function jump() {
      if (!jumping) {
        vy = jumpVelocity;
        jumping = true;
      }
    }

    document.addEventListener('keydown', e => {
      if (e.code === 'ArrowUp' || e.code === 'Space') jump();
    });

    function spawnObstacle() {
      const el = document.createElement('div');
      el.className = 'obstacle';
      el.style.right = '-30px';
      gameEl.appendChild(el);
      obstacles.push({ el, x: gameEl.clientWidth });
    }

    let spawnTimer = 0;
    function loop() {
      vy += gravity;
      y += vy;
      if (y > 0) { y = 0; vy = 0; jumping = false; }
      playerEl.style.transform = `translateY(${-y}px)`;

      spawnTimer++;
      if (spawnTimer > 100) { spawnObstacle(); spawnTimer = 0; }

      for (let i = obstacles.length-1; i>=0; i--) {
        const o = obstacles[i];
        o.x -= 4;
        o.el.style.right = `${gameEl.clientWidth - o.x}px`;
        if (o.x < -30) { o.el.remove(); obstacles.splice(i,1); score++; scoreEl.textContent=score; }
      }

      requestAnimationFrame(loop);
    }
    loop();
  </script>
</body>
</html>
